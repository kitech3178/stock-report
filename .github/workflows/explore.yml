name: 드라이런 실행 (수동)

on:
  workflow_dispatch:   # 메일 없이 리포트만 생성. 예약 실행 없음.
    inputs:
      command:
        description: "실행할 명령"
        default: "python stock_report.py && python tools/show_report.py"
        required: false

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: ${{ inputs.command || 'python stock_report.py && python tools/show_report.py' }}
        env:
          DRY_RUN: "1"
          LLM_COMMENT: "0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: report.html
          if-no-files-found: ignore
