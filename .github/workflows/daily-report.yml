name: 한국주식 데일리 리포트

on:
  schedule:
    # 한국시간 월~금 20:00 (UTC 같은 날 11:00). 그날 장 마감(15:30) 기준 리포트.
    # 공휴일·임시휴장은 스크립트가 마지막 거래일을 확인해 건너뜀 (ONLY_ON_TRADING_DAY).
    - cron: "0 11 * * 1-5"
  workflow_dispatch:   # Actions 탭에서 수동 실행 버튼

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Claude Code CLI 설치 (구독 토큰으로 AI 코멘트를 쓸 때 사용)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: 리포트 생성 및 메일 발송
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}             # API 키 (크레딧 과금)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # 구독 토큰 (claude setup-token)
          # 둘 다 없으면 AI 코멘트 없이 발송. 둘 다 있으면 API 키 우선.
          # 예약 실행일 때만 거래일 검사. 수동 실행(Run workflow)은 항상 보냄.
          ONLY_ON_TRADING_DAY: ${{ github.event_name == 'schedule' && '1' || '0' }}
          MAIL_TO: boribab73@gmail.com                        # 받는 사람 (헤더에 보임, 쉼표로 여러 명)
          MAIL_BCC: dongkizz@naver.com,yozosukny0@naver.com,choiandu@naver.com,onekibi@naver.com  # 숨은 참조 (서로에게 안 보임, 쉼표로 여러 명)
        run: python stock_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: report.html
